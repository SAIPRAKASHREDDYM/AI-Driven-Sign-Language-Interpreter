
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Driven Sign Language Interpreter</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #020617);
            color: white;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            padding: 18px;
            font-size: 25px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .main {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 24px;
            padding: 28px;
            max-width: 1500px;
            margin: auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(34, 197, 94, 0.08);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 0 25px rgba(0, 255, 200, 0.08);
        }

        .video-card {
            flex: 1;
            min-width: 0;
        }

        .video-card img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 12px;
            border: 2px solid #22c55e;
        }

        .info-card {
            width: 300px;
            flex-shrink: 0;
            text-align: center;
        }

        .info-card h3 {
            margin: 8px 0 18px;
            font-size: 20px;
        }

        .detected {
            font-size: 15px;
            color: #cbd5e1;
        }

        .big-text {
            font-size: 100px;
            font-weight: bold;
            line-height: 1.2;
            margin: 12px 0;
            color: #22c55e;
        }

        .confidence-text {
            font-size: 15px;
            margin-bottom: 8px;
        }

        .confidence-bar {
            width: 100%;
            height: 14px;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
        }

        #confidenceFill {
            height: 100%;
            width: 0%;
            background: #22c55e;
            border-radius: 10px;
            transition: width 0.2s ease;
        }

        .metric {
            margin-top: 18px;
            padding: 13px;
            border-radius: 10px;
            background: #1e293b;
            font-size: 16px;
        }

        .status-detect {
            margin-top: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: 11px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            font-size: 14px;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #ef4444;
        }

        .hand-detected {
            color: #22c55e;
        }

        .hand-detected .dot {
            background: #22c55e;
        }

        .no-hand {
            color: #f87171;
        }

        .no-hand .dot {
            background: #ef4444;
        }

        .footer {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            padding: 10px 20px 24px;
        }

        @media (max-width: 850px) {
            .main {
                flex-direction: column;
                align-items: stretch;
                padding: 16px;
            }

            .info-card {
                width: 100%;
            }

            .header {
                font-size: 19px;
            }

            .big-text {
                font-size: 80px;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        🤟 AI-DRIVEN SIGN LANGUAGE INTERPRETER
    </header>

    <main class="main">

        <section class="card video-card">
            <img
                src="{{ url_for('video') }}"
                alt="Live webcam feed showing hand gesture recognition"
            >
        </section>

        <section class="card info-card">

            <h3>Gesture Prediction</h3>

            <div class="detected" id="gestureText">
                Detected: -
            </div>

            <div class="big-text" id="bigLetter">-</div>

            <div class="confidence-text" id="confidenceText">
                Confidence: 0%
            </div>

            <div
                class="confidence-bar"
                role="progressbar"
                aria-label="Prediction confidence"
                aria-valuemin="0"
                aria-valuemax="100"
                id="confidenceBar"
            >
                <div id="confidenceFill"></div>
            </div>

            <div class="metric" id="fpsText">
                FPS: 0
            </div>

            <div class="status-detect no-hand" id="handStatus">
                <span class="dot"></span>
                <span class="text">No Hand Detected</span>
            </div>

        </section>

    </main>

    <footer class="footer">
        Real-Time Hand Gesture Recognition · Phase 1
    </footer>

    <script>
        async function fetchPrediction() {
            try {
                const response = await fetch("/prediction", {
                    cache: "no-store"
                });

                if (!response.ok) {
                    throw new Error("Unable to fetch prediction");
                }

                const data = await response.json();

                const gesture = data.gesture || "none";
                const confidence = Number(data.confidence) || 0;
                const percent = Math.max(
                    0,
                    Math.min(100, Math.round(confidence * 100))
                );

                const isValidGesture =
                    /^[A-Z]$/.test(gesture);

                document.getElementById("gestureText").textContent =
                    "Detected: " +
                    (isValidGesture ? gesture : "-");

                document.getElementById("bigLetter").textContent =
                    isValidGesture ? gesture : "-";

                document.getElementById("confidenceText").textContent =
                    "Confidence: " + percent + "%";

                document.getElementById("confidenceFill").style.width =
                    percent + "%";

                document.getElementById("confidenceBar")
                    .setAttribute("aria-valuenow", percent);

                document.getElementById("fpsText").textContent =
                    "FPS: " + (Number(data.fps) || 0);

                const badge =
                    document.getElementById("handStatus");

                const statusText = badge.querySelector(".text");

                if (data.hand_detected) {
                    statusText.textContent = "Hand Detected";
                    badge.classList.remove("no-hand");
                    badge.classList.add("hand-detected");
                } else {
                    statusText.textContent = "No Hand Detected";
                    badge.classList.remove("hand-detected");
                    badge.classList.add("no-hand");
                }

            } catch (error) {
                console.error("Prediction error:", error);
            }
        }

        fetchPrediction();
        setInterval(fetchPrediction, 300);
    </script>

</body>
</html>
